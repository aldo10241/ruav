# PRODUCCIÓN: cada push a "main" publica https://ruav.com.mx en GitHub Pages.
name: Publicar producción

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar archivos públicos
        run: bash tools/prepare_site.sh production

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
